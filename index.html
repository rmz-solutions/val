<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Maya, will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
      border-radius: 16px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 44px);
      margin: 12px 0 18px;
      line-height: 1.1;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 160px;
      margin: 0 auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease, left .08s linear, top .08s linear;
      touch-action: manipulation;
      white-space: nowrap;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
      border-radius: 14px;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      .card { padding: 22px 16px; border-radius: 18px; }
      .button-zone { height: 190px; width: 100%; }
      button { font-size: 18px; padding: 16px 22px; }
      #yesBtn { left: 12%; }
      #noBtn { left: 58%; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- Puss in Boots image -->
    <img
      class="art"
      src="puss-in-boots-meme-3.jpg"
      alt="Puss in Boots pleading eyes"
    />

    <h1>Maya, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <!-- Tiger Woods gif -->
      <img
        class="fireworks"
        src="giphy.gif"
        alt="Tiger Woods celebration"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON: TRUE RANDOM TELEPORT + ANTI-CORNER ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    let TRIGGER_RADIUS = 230;
    const EDGE_PADDING = 14;   // absolute clamp boundary
    const SAFE_PADDING = 60;   // "no-go" band near edges (prevents cornering)
    const MIN_SEPARATION = 220; // must land far from pointer/finger
    const MAX_TRIES = 80;

    function updateMobileTuning() {
      const isMobile = window.matchMedia("(max-width: 768px)").matches;
      TRIGGER_RADIUS = isMobile ? 280 : 230;
    }
    updateMobileTuning();
    window.addEventListener("resize", updateMobileTuning);
    window.addEventListener("orientationchange", () => setTimeout(updateMobileTuning, 200));

    function setNoPosition(left, top) {
      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";
      noBtn.style.transform = "none";
    }

    function distanceToPointer(left, top, px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const cx = z.left + left + b.width / 2;
      const cy = z.top + top + b.height / 2;
      return Math.hypot(cx - px, cy - py);
    }

    function isNearEdge(left, top, maxLeft, maxTop) {
      return (
        left < SAFE_PADDING ||
        top < SAFE_PADDING ||
        left > (maxLeft - SAFE_PADDING) ||
        top > (maxTop - SAFE_PADDING)
      );
    }

    function randomSafeSpot(maxLeft, maxTop, px, py) {
      const spanX = Math.max(1, maxLeft - 2 * SAFE_PADDING);
      const spanY = Math.max(1, maxTop  - 2 * SAFE_PADDING);

      // Try a bunch of true random interior spots until one is far from pointer.
      for (let i = 0; i < MAX_TRIES; i++) {
        const left = SAFE_PADDING + Math.random() * spanX;
        const top  = SAFE_PADDING + Math.random() * spanY;

        if (distanceToPointer(left, top, px, py) >= MIN_SEPARATION) {
          return { left, top };
        }
      }

      // Fallback: center-ish
      return {
        left: clamp(maxLeft * 0.5, SAFE_PADDING, maxLeft - SAFE_PADDING),
        top:  clamp(maxTop  * 0.5, SAFE_PADDING, maxTop  - SAFE_PADDING)
      };
    }

    // If cornered, force a "wrap" to the opposite side-ish, still inside SAFE_PADDING
    function wrapOpposite(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const curLeft = b.left - z.left;
      const curTop  = b.top - z.top;

      let left = (maxLeft - curLeft);
      let top  = (maxTop  - curTop);

      // add jitter so it doesn't feel deterministic
      left += (Math.random() * 2 - 1) * Math.min(120, maxLeft * 0.30);
      top  += (Math.random() * 2 - 1) * Math.min(90,  maxTop  * 0.35);

      left = clamp(left, EDGE_PADDING, maxLeft - EDGE_PADDING);
      top  = clamp(top,  EDGE_PADDING, maxTop  - EDGE_PADDING);

      if (isNearEdge(left, top, maxLeft, maxTop) || distanceToPointer(left, top, px, py) < MIN_SEPARATION) {
        return randomSafeSpot(maxLeft, maxTop, px, py);
      }
      return { left, top };
    }

    function teleportNo(px, py, forceWrap = false) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const curLeft = b.left - z.left;
      const curTop  = b.top - z.top;

      // If it’s near edges (getting cornered) or forced, do a wrap jump.
      if (forceWrap || isNearEdge(curLeft, curTop, maxLeft, maxTop)) {
        const spot = wrapOpposite(px, py);
        setNoPosition(spot.left, spot.top);
        growYes();
        return;
      }

      // Otherwise: pure random safe teleport (not side-to-side)
      const spot = randomSafeSpot(maxLeft, maxTop, px, py);
      setNoPosition(spot.left, spot.top);
      growYes();
    }

    /* ---------- MOBILE-FRIENDLY POINTER TRACKING ---------- */
    let lastX = null, lastY = null;
    let chasing = false;

    function updateLastFromEvent(e) {
      if (!e) return;
      if (e.touches && e.touches[0]) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else {
        lastX = e.clientX;
        lastY = e.clientY;
      }
    }

    function tick() {
      if (chasing && lastX != null && lastY != null) {
        const b = noBtn.getBoundingClientRect();
        const d = Math.hypot(
          (b.left + b.width / 2) - lastX,
          (b.top + b.height / 2) - lastY
        );
        if (d < TRIGGER_RADIUS) teleportNo(lastX, lastY);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    zone.addEventListener("pointermove", (e) => updateLastFromEvent(e), { passive: true });
    zone.addEventListener("pointerdown", (e) => {
      updateLastFromEvent(e);
      chasing = true;
      // immediate jump so it doesn't get tapped on first press
      teleportNo(lastX, lastY, true);
    }, { passive: false });
    zone.addEventListener("pointerup", () => { chasing = false; }, { passive: true });
    zone.addEventListener("pointercancel", () => { chasing = false; }, { passive: true });

    zone.addEventListener("touchstart", (e) => {
      e.preventDefault();
      updateLastFromEvent(e);
      chasing = true;
      teleportNo(lastX, lastY, true);
    }, { passive: false });

    zone.addEventListener("touchmove", (e) => {
      e.preventDefault();
      updateLastFromEvent(e);
    }, { passive: false });

    zone.addEventListener("touchend", () => { chasing = false; }, { passive: true });
    zone.addEventListener("touchcancel", () => { chasing = false; }, { passive: true });

    // Prevent "snipes"
    noBtn.addEventListener("pointerenter", (e) => {
      updateLastFromEvent(e);
      teleportNo(e.clientX, e.clientY, true);
    });

    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      updateLastFromEvent(e);
      teleportNo(e.clientX, e.clientY, true);
    }, { passive: false });

    noBtn.addEventListener("click", (e) => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
