<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <!-- Confetti (optional – page still works if blocked) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68;
    }
    *{box-sizing:border-box}
    html,body{height:100%;overscroll-behavior:none}
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif; overflow:hidden; padding:16px;
      -webkit-text-size-adjust:100%; touch-action:none;
    }

    #confettiCanvas{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;}

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
    }

    .art{
      width:min(260px,80vw);
      margin:0 auto 10px;
      display:block;
      border-radius:16px;
      filter:drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1{font-size:clamp(24px,5vw,44px); margin:12px 0 18px; line-height:1.1;}

    /* TALLER ZONE → allows real 2D teleporting */
    .button-zone{
      position:relative;
      width:min(520px,92%);
      height:300px;
      margin:0 auto;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    button{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      padding:16px 24px;
      font-size:18px;
      font-weight:800;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }

    #yesBtn{left:16%; background:var(--yes); color:#fff;}
    #yesBtn:hover{background:var(--yesHover);}

    #noBtn{
      left:60%;
      background:#e5e7eb;
      color:#111827;
      will-change:left, top;
      transition:left 35ms linear, top 35ms linear; /* VERY FAST + SMOOTH */
    }

    .hint{margin-top:10px; font-size:13px; opacity:.7;}
    .result{display:none; margin-top:18px; animation:pop .35s ease;}
    .result h2{font-size:clamp(30px,5vw,46px); margin:10px 0;}
    .fireworks{width:min(380px,90vw); margin:0 auto; display:block; border-radius:14px;}

    @keyframes pop{from{transform:scale(.96); opacity:0} to{transform:scale(1); opacity:1}}

    @media (max-width:480px){
      .card{padding:22px 16px; border-radius:18px;}
      .button-zone{height:340px;}
      #yesBtn{left:12%;}
      #noBtn{left:58%;}
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <img class="art" src="puss-in-boots-meme-3.jpg" alt="Puss in Boots" />

    <h1>Maya, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img class="fireworks" src="giphy.gif" alt="Tiger Woods celebration" />
    </section>
  </main>

  <script>
  window.addEventListener("DOMContentLoaded", () => {

    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint   = document.getElementById("hint");

    /* ---- CONFETTI SAFE INIT ---- */
    const confettiCanvas = document.getElementById("confettiCanvas");
    const canConfetti = typeof window.confetti === "function";
    const confettiInstance = canConfetti ? window.confetti.create(confettiCanvas,{resize:false,useWorker:true}) : null;

    function fullScreenConfetti(){
      if(!confettiInstance) return;
      const end = Date.now()+1600;
      (function frame(){
        confettiInstance({
          particleCount:12, spread:90, startVelocity:45, ticks:180,
          origin:{x:Math.random(),y:Math.random()*0.3}
        });
        if(Date.now()<end) requestAnimationFrame(frame);
      })();
    }

    /* ---- NO BUTTON: TRUE RANDOM 2D TELEPORT ---- */
    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

    function getGeom(){
      const z=zone.getBoundingClientRect();
      const b=noBtn.getBoundingClientRect();
      return{
        z,b,
        maxLeft:Math.max(0,z.width-b.width),
        maxTop:Math.max(0,z.height-b.height),
        curLeft:b.left-z.left,
        curTop:b.top-z.top
      };
    }

    function tuning(maxLeft,maxTop){
      return{
        safeX:clamp(maxLeft*0.16,12,80),
        safeY:clamp(maxTop*0.16,12,80),
        minSep:clamp(Math.min(maxLeft,maxTop)*0.6,160,360),
        trigger:clamp(Math.min(maxLeft,maxTop)*0.75,240,520)
      };
    }

    function dist(left,top,px,py){
      const{z,b}=getGeom();
      const cx=z.left+left+b.width/2;
      const cy=z.top+top+b.height/2;
      return Math.hypot(cx-px,cy-py);
    }

    function isEdge(left,top,maxLeft,maxTop,safeX,safeY){
      return(
        left<safeX||
        top<safeY||
        left>maxLeft-safeX||
        top>maxTop-safeY
      );
    }

    function setNo(left,top){
      const{maxLeft,maxTop}=getGeom();
      noBtn.style.left=clamp(left,0,maxLeft)+"px";
      noBtn.style.top =clamp(top,0,maxTop)+"px";
    }

    function randomSpot(px,py,force=false){
      const{maxLeft,maxTop}=getGeom();
      const{safeX,safeY,minSep}=tuning(maxLeft,maxTop);

      const padX=force?clamp(safeX+40,safeX,maxLeft/2):safeX;
      const padY=force?clamp(safeY+40,safeY,maxTop/2):safeY;

      const spanX=Math.max(1,maxLeft-2*padX);
      const spanY=Math.max(1,maxTop-2*padY);

      for(let i=0;i<200;i++){
        const L=padX+Math.random()*spanX;
        const T=padY+Math.random()*spanY;
        if(dist(L,T,px,py)>=minSep) return{left:L,top:T};
      }

      return{left:maxLeft/2,top:maxTop/2};
    }

    function teleport(px,py,force=false){
      const{maxLeft,maxTop,curLeft,curTop}=getGeom();
      const{safeX,safeY}=tuning(maxLeft,maxTop);

      const cornered=isEdge(curLeft,curTop,maxLeft,maxTop,safeX,safeY);
      const spot=randomSpot(px,py,force||cornered);
      setNo(spot.left,spot.top);
    }

    /* ---- POINTER TRACKING ---- */
    let lastX=null,lastY=null,chasing=false,cooldown=0;
    const COOLDOWN_MS=18; // VERY aggressive

    function upd(e){
      if(e.touches&&e.touches[0]){
        lastX=e.touches[0].clientX;
        lastY=e.touches[0].clientY;
      }else{
        lastX=e.clientX; lastY=e.clientY;
      }
    }

    function tick(){
      if(chasing&&lastX!=null){
        const now=performance.now();
        if(now>=cooldown){
          const{b,maxLeft,maxTop}=getGeom();
          const{trigger}=tuning(maxLeft,maxTop);

          const d=Math.hypot(
            (b.left+b.width/2)-lastX,
            (b.top+b.height/2)-lastY
          );

          if(d<trigger){
            teleport(lastX,lastY);
            cooldown=now+COOLDOWN_MS;
          }
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    zone.addEventListener("pointermove",upd,{passive:true});
    zone.addEventListener("pointerdown",(e)=>{upd(e);chasing=true;teleport(lastX,lastY,true);},{passive:false});
    zone.addEventListener("pointerup",()=>chasing=false,{passive:true});

    noBtn.addEventListener("pointerenter",(e)=>{upd(e);teleport(e.clientX,e.clientY,true);});
    noBtn.addEventListener("pointerdown",(e)=>{e.preventDefault();upd(e);teleport(e.clientX,e.clientY,true);},{passive:false});
    noBtn.addEventListener("click",(e)=>e.preventDefault());

    /* ---- YES CLICK ---- */
    yesBtn.addEventListener("click",()=>{
      zone.style.display="none";
      hint.style.display="none";
      result.style.display="block";
      fullScreenConfetti();
    });

    // Initial random placement
    const spot=randomSpot(window.innerWidth/2,window.innerHeight/2,true);
    setNo(spot.left,spot.top);

  });
  </script>

</body>
</html>
