<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc; --yes:#ff3b7a; --yesHover:#ff1f68;
    }
    *{box-sizing:border-box}
    html,body{height:100%; overscroll-behavior:none}
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif; overflow:hidden; padding:16px;
      -webkit-text-size-adjust:100%; touch-action:none;
    }

    #confettiCanvas{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;}

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .art{
      width:min(260px,80vw);
      margin:0 auto 0;
      display:block;
      border-radius:16px;
      filter:drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1{
      font-size:clamp(24px,5vw,44px);
      margin:8px 0 0;
      line-height:1.1;
    }

    #playArea{
      position:relative;
      width:min(560px, 96%);
      margin:0 auto;
      height:240px;
      border-radius:18px;
      background:transparent;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    button{
      position:absolute;
      padding:16px 24px;
      font-size:18px;
      font-weight:800;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }

    #yesBtn{
      left:28%;
      top:50%;
      transform:translate(-50%, -50%);
      background:var(--yes);
      color:#fff;
    }
    #yesBtn:hover{background:var(--yesHover);}

    /* IMPORTANT: start in-place; no movement until pointer approaches */
    #noBtn{
      left:72%;
      top:50%;
      transform:translate(-50%, -50%);
      background:#e5e7eb;
      color:#111827;

      pointer-events:none;      /* can't hover/click */
      will-change:transform;
      transition:transform 85ms cubic-bezier(.12,.95,.2,1);
    }

    .hint{margin-top:2px; font-size:13px; opacity:.7;}

    .result{
      display:none;
      margin-top:8px;
      animation:pop .35s ease;
    }
    .result h2{font-size:clamp(30px,5vw,46px); margin:10px 0;}
    .fireworks{width:min(380px,90vw); margin:0 auto; display:block; border-radius:14px;}

    @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

    @media (max-width:480px){
      .card{padding:22px 16px; border-radius:18px;}
      #playArea{height:300px; width:100%;}
      #yesBtn{left:26%;}
      #noBtn{left:74%;}
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <img class="art" src="puss-in-boots-meme-3.jpg" alt="Puss in Boots" />
    <h1>Maya, will you be my valentine?</h1>

    <section id="playArea">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">I won't take no for an answer :) (also bonus points if you know where the photo is from)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img class="fireworks" src="giphy.gif" alt="Tiger Woods celebration" />
    </section>
  </main>

  <script>
    const playArea = document.getElementById("playArea");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint   = document.getElementById("hint");
    const confettiCanvas = document.getElementById("confettiCanvas");

    /* ---------- Confetti (safe) ---------- */
    function resizeConfettiCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const canConfetti = typeof window.confetti === "function";
    const confettiInstance = canConfetti ? window.confetti.create(confettiCanvas, { resize:false, useWorker:true }) : null;

    function fullScreenConfetti(){
      if(!confettiInstance) return;
      const end = Date.now() + 1400;
      (function frame(){
        confettiInstance({
          particleCount: 14,
          spread: 100,
          startVelocity: 52,
          ticks: 190,
          origin: { x: Math.random(), y: Math.random() * 0.35 }
        });
        if(Date.now() < end) requestAnimationFrame(frame);
      })();
      setTimeout(() => confettiInstance({
        particleCount: 260,
        spread: 140,
        startVelocity: 62,
        ticks: 220,
        origin: { x: 0.5, y: 0.55 }
      }), 250);
    }

    /* ---------- NO movement: only on proximity ---------- */
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

    function aRect(){ return playArea.getBoundingClientRect(); }
    function bRect(){ return noBtn.getBoundingClientRect(); }

    function tuning(){
      const a = aRect();
      const w = Math.max(1, a.width);
      const h = Math.max(1, a.height);

      const padX = clamp(w * 0.10, 10, 56);
      const padY = clamp(h * 0.10, 10, 56);

      // how far away it must land from pointer
      const minSep = clamp(Math.min(w, h) * 0.65, 180, 520);

      // force-field around button rect; pointer entering this triggers movement
      const preempt = clamp(Math.min(w, h) * 0.28, 90, 190);

      return { a, padX, padY, minSep, preempt };
    }

    function pickTarget(px, py, forceDeep=false){
      const { a, padX, padY, minSep } = tuning();
      const b = bRect();

      const minCX = padX + b.width/2;
      const maxCX = a.width - padX - b.width/2;
      const minCY = padY + b.height/2;
      const maxCY = a.height - padY - b.height/2;

      const spanX = Math.max(1, maxCX - minCX);
      const spanY = Math.max(1, maxCY - minCY);
      if (spanX < 2 || spanY < 2) return { cx: a.width/2, cy: a.height/2 };

      // Bias away from pointer (opposite-ish)
      const localX = px - a.left;
      const localY = py - a.top;
      const awayX = localX < a.width/2 ? (a.width*0.72) : (a.width*0.28);
      const awayY = localY < a.height/2 ? (a.height*0.70) : (a.height*0.30);

      const deep = forceDeep ? 22 : 0;

      for (let i=0; i<260; i++){
        // Mix: mostly around away target, sometimes totally random
        const r = Math.random();
        const cx = r < 0.78
          ? clamp(awayX + (Math.random()*2-1) * (a.width*0.22), minCX+deep, maxCX-deep)
          : (minCX + Math.random()*spanX);
        const cy = r < 0.78
          ? clamp(awayY + (Math.random()*2-1) * (a.height*0.25), minCY+deep, maxCY-deep)
          : (minCY + Math.random()*spanY);

        const worldX = a.left + cx;
        const worldY = a.top  + cy;
        if (Math.hypot(worldX - px, worldY - py) >= minSep) return { cx, cy };
      }

      return { cx: (minCX+maxCX)/2, cy: (minCY+maxCY)/2 };
    }

    function moveNoTo(cx, cy){
      // convert center local -> translate relative to its original position by using left/top directly
      // easiest: set left/top in % via px, keep translate(-50,-50)
      noBtn.style.left = cx + "px";
      noBtn.style.top  = cy + "px";
    }

    function pointerTriggers(px, py){
      const { preempt } = tuning();
      const b = bRect();
      const left = b.left - preempt;
      const right = b.right + preempt;
      const top = b.top - preempt;
      const bottom = b.bottom + preempt;
      return (px >= left && px <= right && py >= top && py <= bottom);
    }

    let armed = true;
    let lastJump = 0;

    function maybeEvade(px, py, force=false){
      if (!armed) return;
      const now = performance.now();

      // only move when cursor gets close (or forced by press)
      if (!force && !pointerTriggers(px, py)) return;

      // light throttle to keep it smooth (prevents spam-jitter)
      if (!force && now - lastJump < 45) return;
      lastJump = now;

      const { a } = tuning();
      const tgt = pickTarget(px, py, true);
      // set local coords; since we are using left/top with translate(-50,-50),
      // we need to set left/top relative to playArea.
      moveNoTo(tgt.cx, tgt.cy);
    }

    // IMPORTANT: when using px left/top for NO, we must make playArea the containing block.
    // So we set NO to position relative to playArea by using offset parent coordinates.
    // We'll do that by converting within playArea in maybeEvade:
    function convertAndEvade(px, py, force=false){
      const a = aRect();
      // set the button inside playArea coordinates (so it moves in the white space)
      // (We already pick targets in playArea local coords.)
      maybeEvade(px, py, force);
    }

    // On pointer move: ONLY evasive when close
    window.addEventListener("pointermove", (e) => convertAndEvade(e.clientX, e.clientY, false), { passive:true });

    // On press: force a move (prevents click-snipes)
    window.addEventListener("pointerdown", (e) => convertAndEvade(e.clientX, e.clientY, true), { passive:true });

    // Touch fallback
    window.addEventListener("touchstart", (e) => {
      const t = e.touches && e.touches[0];
      if (t) convertAndEvade(t.clientX, t.clientY, true);
    }, { passive:true });

    // IMPORTANT: do NOT reposition on load.
    // Just ensure left/top are numeric in playArea space:
    window.addEventListener("load", () => {
      // convert current % positions to pixel positions within playArea once, WITHOUT MOVING VISUALLY.
      // We'll read the current computed rect and map it into playArea coords, then set left/top px.
      const a = aRect();
      const b = bRect();
      const cx = (b.left + b.width/2) - a.left;
      const cy = (b.top  + b.height/2) - a.top;

      // Temporarily disable transition so this doesn't animate.
      const old = noBtn.style.transition;
      noBtn.style.transition = "none";
      noBtn.style.left = cx + "px";
      noBtn.style.top  = cy + "px";
      noBtn.style.transform = "translate(-50%, -50%)";
      requestAnimationFrame(() => { noBtn.style.transition = old || "transform 85ms cubic-bezier(.12,.95,.2,1)"; });
    });

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      armed = false;
      playArea.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive:false });
  </script>
</body>
</html>
