<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(24px, 5vw, 44px);
      margin: 12px 0 18px;
      line-height: 1.1;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 170px;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      /* IMPORTANT: allow touch events without page scrolling */
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
      touch-action: manipulation;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
      transition: left .08s linear, top .08s linear, transform .12s ease;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Mobile layout: make the zone taller and buttons bigger targets */
    @media (max-width: 520px) {
      .card { padding: 22px 16px; border-radius: 18px; }
      .button-zone { width: 100%; height: 230px; }
      button { font-size: 20px; padding: 18px 26px; }
      #yesBtn { left: 10%; }
      #noBtn { left: 55%; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- ANIMAL WITH HEART -->
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>

      <path d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
            fill="url(#heart)"/>

      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

      <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
      <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>

      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>

      <path d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z"
            fill="#ff7aa2"/>
    </svg>

    <h1>Maya, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img
        class="fireworks"
        src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
        alt="Fireworks"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON (TOUCH-FIRST + UN-CORNERABLE + WRAP) ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    // We tune differently for touch vs mouse.
    function isTouchDevice() {
      return (
        ("ontouchstart" in window) ||
        (navigator.maxTouchPoints && navigator.maxTouchPoints > 0)
      );
    }

    // These get updated on load/resize.
    let TRIGGER_RADIUS = 220;      // how close before it flees
    let MIN_SEPARATION = 200;      // how far it must land away from finger/cursor

    const EDGE_PADDING = 14;       // absolute clamp
    const SAFE_PADDING = 56;       // interior-only band (prevents pinning/cornering)
    const MAX_TRIES = 26;

    function retune() {
      const touch = isTouchDevice() || window.matchMedia("(pointer: coarse)").matches;
      // On phones, fingers are big and there's no "hover", so we react earlier and jump farther.
      TRIGGER_RADIUS = touch ? 320 : 230;
      MIN_SEPARATION = touch ? 260 : 210;
    }
    retune();
    window.addEventListener("resize", retune);
    window.addEventListener("orientationchange", () => setTimeout(retune, 200));

    function setNoPosition(left, top) {
      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";
      noBtn.style.transform = "none";
    }

    function distanceToPoint(left, top, px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const cx = z.left + left + b.width / 2;
      const cy = z.top + top + b.height / 2;
      return Math.hypot(cx - px, cy - py);
    }

    function isNearEdge(left, top, maxLeft, maxTop) {
      return (
        left < SAFE_PADDING ||
        top < SAFE_PADDING ||
        left > (maxLeft - SAFE_PADDING) ||
        top > (maxTop - SAFE_PADDING)
      );
    }

    function randomSafeSpot(maxLeft, maxTop, px, py) {
      const spanX = Math.max(1, maxLeft - 2 * SAFE_PADDING);
      const spanY = Math.max(1, maxTop  - 2 * SAFE_PADDING);

      for (let i = 0; i < 70; i++) {
        const left = SAFE_PADDING + Math.random() * spanX;
        const top  = SAFE_PADDING + Math.random() * spanY;
        if (distanceToPoint(left, top, px, py) >= MIN_SEPARATION) return { left, top };
      }
      return { left: maxLeft * 0.5, top: maxTop * 0.5 };
    }

    // Wrap to opposite side (mirror + jitter), then enforce safe interior rules
    function wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py) {
      const jitterX = (Math.random() * 2 - 1) * Math.min(110, maxLeft * 0.30);
      const jitterY = (Math.random() * 2 - 1) * Math.min(85,  maxTop  * 0.45);

      let left = (maxLeft - curLeft) + jitterX;
      let top  = (maxTop  - curTop)  + jitterY;

      left = clamp(left, EDGE_PADDING, maxLeft - EDGE_PADDING);
      top  = clamp(top,  EDGE_PADDING, maxTop  - EDGE_PADDING);

      if (isNearEdge(left, top, maxLeft, maxTop) || distanceToPoint(left, top, px, py) < MIN_SEPARATION) {
        return randomSafeSpot(maxLeft, maxTop, px, py);
      }
      return { left, top };
    }

    function moveNoSmart(px, py, forceWrap = false) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const curLeft = b.left - z.left;
      const curTop  = b.top - z.top;

      // If cornered or forced wrap -> wrap/teleport immediately
      if (forceWrap || isNearEdge(curLeft, curTop, maxLeft, maxTop)) {
        const spot = wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py);
        setNoPosition(spot.left, spot.top);
        growYes();
        return;
      }

      // Run away directionally (only accept interior placements)
      for (let i = 0; i < MAX_TRIES; i++) {
        const btnCx = b.left + b.width / 2;
        const btnCy = b.top + b.height / 2;

        let dx = btnCx - px;
        let dy = btnCy - py;
        const mag = Math.hypot(dx, dy) || 1;
        dx /= mag; dy /= mag;

        const jitter = (Math.random() * 190 - 95) * (Math.PI / 180);
        const cos = Math.cos(jitter), sin = Math.sin(jitter);
        const jx = dx * cos - dy * sin;
        const jy = dx * sin + dy * cos;

        const dist = (isTouchDevice() ? 320 : 250) + Math.random() * (isTouchDevice() ? 260 : 180) + i * 10;

        let newLeft = curLeft + jx * dist;
        let newTop  = curTop  + jy * dist;

        newLeft = clamp(newLeft, EDGE_PADDING, maxLeft - EDGE_PADDING);
        newTop  = clamp(newTop,  EDGE_PADDING, maxTop  - EDGE_PADDING);

        if (isNearEdge(newLeft, newTop, maxLeft, maxTop)) continue;
        if (distanceToPoint(newLeft, newTop, px, py) < MIN_SEPARATION) continue;

        setNoPosition(newLeft, newTop);
        growYes();
        return;
      }

      const spot = randomSafeSpot(maxLeft, maxTop, px, py);
      setNoPosition(spot.left, spot.top);
      growYes();
    }

    // Helper: get a point from either pointer or touch events
    function getEventPoint(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    // This is the key "mobile friendly" behavior:
    // On mobile there's no hover/cursor, so ANY touch in the zone acts like "the finger is here".
    // If the finger is near the No button, it jumps away immediately.
    function reactToFinger(e, forceWrap = false) {
      const { x, y } = getEventPoint(e);

      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width / 2) - x, (b.top + b.height / 2) - y);

      // If touch is near, or the touch is literally on/inside the No button, jump.
      const onNo = (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom);

      if (onNo || d < TRIGGER_RADIUS) {
        // forceWrap makes it feel like it "teleports" away on direct attempts
        moveNoSmart(x, y, forceWrap || onNo);
      }
    }

    /* ---------- INPUT EVENTS ---------- */

    // Desktop/trackpad: proximity on pointer move
    zone.addEventListener("pointermove", (e) => reactToFinger(e, false), { passive: true });

    // If they try to press on/near it (desktop or mobile pointer), force wrap immediately
    zone.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      reactToFinger(e, true);
    }, { passive: false });

    // Extra: if the pointer ever enters the No button area, wrap immediately (fast snipes)
    noBtn.addEventListener("pointerenter", (e) => reactToFinger(e, true), { passive: true });

    // Mobile: touchstart/move are the primary “finger tracking”
    zone.addEventListener("touchstart", (e) => {
      e.preventDefault();          // prevent scrolling/zoom gestures inside the zone
      reactToFinger(e, true);      // immediate jump on first touch
    }, { passive: false });

    zone.addEventListener("touchmove", (e) => {
      e.preventDefault();
      reactToFinger(e, false);     // keep fleeing while finger moves
    }, { passive: false });

    // Prevent the "No" click from ever firing
    noBtn.addEventListener("click", (e) => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    // iOS pinch gestures inside the page (optional safety)
    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
