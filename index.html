<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;

      /* smoother motion for the new logic */
      transition: left .08s linear, top .08s linear, transform .12s ease;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- ANIMAL WITH HEART -->
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>

      <path d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
            fill="url(#heart)"/>

      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

      <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
      <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>

      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>

      <path d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z"
            fill="#ff7aa2"/>
    </svg>

    <h1>Maya, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img
        class="fireworks"
        src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
        alt="Fireworks"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON RUNS AWAY (UN-CORNERABLE + WRAP) ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    // Tune these (bigger = harder to catch)
    const TRIGGER_RADIUS = 220;      // start running earlier
    const MIN_SEPARATION = 200;      // must land far from pointer
    const EDGE_PADDING = 14;         // hard clamp boundary
    const SAFE_PADDING = 52;         // "no-go" band near edges (prevents pinning/cornering)
    const MAX_TRIES = 22;

    function setNoPosition(left, top) {
      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";
      noBtn.style.transform = "none";
    }

    function distanceToPointer(left, top, px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const cx = z.left + left + b.width / 2;
      const cy = z.top + top + b.height / 2;
      return Math.hypot(cx - px, cy - py);
    }

    function isNearEdge(left, top, maxLeft, maxTop) {
      return (
        left < SAFE_PADDING ||
        top < SAFE_PADDING ||
        left > (maxLeft - SAFE_PADDING) ||
        top > (maxTop - SAFE_PADDING)
      );
    }

    function randomSafeSpot(maxLeft, maxTop, px, py) {
      const spanX = Math.max(1, maxLeft - 2 * SAFE_PADDING);
      const spanY = Math.max(1, maxTop  - 2 * SAFE_PADDING);

      for (let i = 0; i < 50; i++) {
        const left = SAFE_PADDING + Math.random() * spanX;
        const top  = SAFE_PADDING + Math.random() * spanY;
        if (distanceToPointer(left, top, px, py) >= MIN_SEPARATION) return { left, top };
      }
      return { left: maxLeft * 0.5, top: maxTop * 0.5 };
    }

    // WRAP: mirror to opposite side (plus jitter), then enforce safe interior rules
    function wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py) {
      const b = noBtn.getBoundingClientRect();
      const jitterX = (Math.random() * 2 - 1) * Math.min(80, maxLeft * 0.25);
      const jitterY = (Math.random() * 2 - 1) * Math.min(50, maxTop * 0.35);

      let left = (maxLeft - curLeft) + jitterX;
      let top  = (maxTop - curTop) + jitterY;

      left = clamp(left, EDGE_PADDING, maxLeft - EDGE_PADDING);
      top  = clamp(top,  EDGE_PADDING, maxTop  - EDGE_PADDING);

      // If wrap landed near edges or too close to pointer, pick a random safe spot.
      if (isNearEdge(left, top, maxLeft, maxTop) || distanceToPointer(left, top, px, py) < MIN_SEPARATION) {
        return randomSafeSpot(maxLeft, maxTop, px, py);
      }
      return { left, top };
    }

    function moveNoSmart(px, py, forceWrap = false) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const curLeft = b.left - z.left;
      const curTop  = b.top - z.top;

      // If getting cornered OR we explicitly want to wrap, wrap/teleport immediately.
      if (forceWrap || isNearEdge(curLeft, curTop, maxLeft, maxTop)) {
        const spot = wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py);
        setNoPosition(spot.left, spot.top);
        growYes();
        return;
      }

      // Otherwise: run away, but ONLY accept interior placements (never edge/cornerable)
      for (let i = 0; i < MAX_TRIES; i++) {
        const btnCx = b.left + b.width / 2;
        const btnCy = b.top + b.height / 2;

        let dx = btnCx - px;
        let dy = btnCy - py;
        const mag = Math.hypot(dx, dy) || 1;
        dx /= mag; dy /= mag;

        // add randomness so it isn't predictable
        const jitter = (Math.random() * 170 - 85) * (Math.PI / 180);
        const cos = Math.cos(jitter), sin = Math.sin(jitter);
        const jx = dx * cos - dy * sin;
        const jy = dx * sin + dy * cos;

        const dist = 230 + Math.random() * 170 + i * 10;

        let newLeft = curLeft + jx * dist;
        let newTop  = curTop + jy * dist;

        // hard clamp
        newLeft = clamp(newLeft, EDGE_PADDING, maxLeft - EDGE_PADDING);
        newTop  = clamp(newTop,  EDGE_PADDING, maxTop  - EDGE_PADDING);

        // reject edge/cornerable placements
        if (isNearEdge(newLeft, newTop, maxLeft, maxTop)) continue;

        // reject too close to pointer
        if (distanceToPointer(newLeft, newTop, px, py) < MIN_SEPARATION) continue;

        setNoPosition(newLeft, newTop);
        growYes();
        return;
      }

      // If we couldn't find a good directional spot, teleport to safe interior
      const spot = randomSafeSpot(maxLeft, maxTop, px, py);
      setNoPosition(spot.left, spot.top);
      growYes();
    }

    // Start running earlier
    zone.addEventListener("pointermove", (e) => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      if (d < TRIGGER_RADIUS) moveNoSmart(e.clientX, e.clientY);
    });

    // Recommendation: jump the moment the pointer enters the button (prevents fast “snipes”)
    noBtn.addEventListener("pointerenter", (e) => {
      moveNoSmart(e.clientX, e.clientY, true); // force wrap
    });

    // Also jump on press/tap (mobile)
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveNoSmart(e.clientX, e.clientY, true); // force wrap
    });

    // Prevent click
    noBtn.addEventListener("click", (e) => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
