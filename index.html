<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68;
    }
    *{box-sizing:border-box}

    html,body{height:100%; overscroll-behavior:none; -webkit-text-size-adjust:100%;}
    body{
      margin:0; min-height:100svh;
      display:grid; place-items:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif;
      overflow:hidden; padding:16px;
      touch-action:none; /* stop scroll/zoom while chasing */
    }

    #confettiCanvas{
      position:fixed; inset:0;
      width:100vw; height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
    }

    /* Puss image */
    .art{
      width:min(260px,80vw);
      height:auto;
      margin:0 auto 10px;
      display:block;
      border-radius:18px;
      box-shadow:0 10px 14px rgba(0,0,0,.18);
    }

    h1{
      font-size:clamp(24px,5vw,44px);
      margin:12px 0 18px;
      line-height:1.1;
    }

    .button-zone{
      position:relative;
      width:min(520px,92%);
      height:170px;
      margin:0 auto;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    button{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      padding:16px 24px;
      font-size:18px;
      font-weight:800;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition:transform .12s ease, background .12s ease;
      touch-action:manipulation;
    }

    #yesBtn{
      left:18%;
      background:var(--yes);
      color:#fff;
    }
    #yesBtn:hover{ background:var(--yesHover); }

    #noBtn{
      left:62%;
      background:#e5e7eb;
      color:#111827;
      transition:left .08s linear, top .08s linear, transform .12s ease;
    }

    .hint{ margin-top:10px; font-size:13px; opacity:.7; }

    .result{
      display:none;
      margin-top:18px;
      animation:pop .35s ease;
    }
    .result h2{
      font-size:clamp(30px,5vw,46px);
      margin:10px 0;
    }
    .fireworks{
      width:min(380px,90vw);
      margin:0 auto;
      display:block;
    }

    @keyframes pop{
      from{transform:scale(.96); opacity:0;}
      to{transform:scale(1); opacity:1;}
    }

    @media (max-width:480px){
      .card{ padding:22px 16px; border-radius:18px; }
      .button-zone{ height:230px; width:100%; }
      button{ font-size:20px; padding:18px 26px; }
      #yesBtn{ left:10%; }
      #noBtn{ left:55%; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <img class="art" src="puss-in-boots-meme-3.jpg" alt="Puss in Boots begging eyes" />

    <h1>Maya, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img class="fireworks"
        src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
        alt="Fireworks" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint   = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width  = Math.floor(window.innerWidth  * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const confettiInstance = confetti.create(confettiCanvas, { resize:false, useWorker:true });

    function fullScreenConfetti(){
      const end = Date.now() + 1600;

      (function frame(){
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES GROWS ---------- */
    let yesScale = 1;
    function growYes(){
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO RUNS AWAY: DESKTOP (CURSOR) + MOBILE (FINGER) ---------- */
    const mqFine   = window.matchMedia("(pointer: fine)");
    const mqCoarse = window.matchMedia("(pointer: coarse)");

    function isTouchLike(){
      // “coarse” pointer is most phones/tablets; also covers some browsers that don’t report it well
      return mqCoarse.matches || ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
    }

    function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

    // These are tuned per input type
    let TRIGGER_RADIUS = 220;
    let MIN_SEPARATION = 200;

    // Edge / anti-corner tuning
    const EDGE_PADDING = 14;
    const SAFE_PADDING = 56; // interior-only band (prevents pinning/cornering)
    const MAX_TRIES = 26;

    function retune(){
      const touch = isTouchLike();
      TRIGGER_RADIUS = touch ? 320 : 220;  // finger has no hover, so use bigger radius
      MIN_SEPARATION = touch ? 260 : 200;
    }
    retune();
    mqFine.addEventListener?.("change", retune);
    mqCoarse.addEventListener?.("change", retune);
    window.addEventListener("resize", retune);
    window.addEventListener("orientationchange", () => setTimeout(retune, 200));

    function setNoPosition(left, top){
      noBtn.style.left = left + "px";
      noBtn.style.top  = top  + "px";
      noBtn.style.transform = "none";
    }

    function distanceToPoint(left, top, px, py){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const cx = z.left + left + b.width / 2;
      const cy = z.top  + top  + b.height / 2;
      return Math.hypot(cx - px, cy - py);
    }

    function isNearEdge(left, top, maxLeft, maxTop){
      return (
        left < SAFE_PADDING ||
        top < SAFE_PADDING ||
        left > (maxLeft - SAFE_PADDING) ||
        top > (maxTop - SAFE_PADDING)
      );
    }

    function randomSafeSpot(maxLeft, maxTop, px, py){
      const spanX = Math.max(1, maxLeft - 2 * SAFE_PADDING);
      const spanY = Math.max(1, maxTop  - 2 * SAFE_PADDING);

      for (let i = 0; i < 70; i++){
        const left = SAFE_PADDING + Math.random() * spanX;
        const top  = SAFE_PADDING + Math.random() * spanY;
        if (distanceToPoint(left, top, px, py) >= MIN_SEPARATION) return { left, top };
      }
      return { left: maxLeft * 0.5, top: maxTop * 0.5 };
    }

    // WRAP: mirror to opposite side (plus jitter), then enforce safe interior rules
    function wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py){
      const jitterX = (Math.random() * 2 - 1) * Math.min(110, maxLeft * 0.30);
      const jitterY = (Math.random() * 2 - 1) * Math.min(85,  maxTop  * 0.45);

      let left = (maxLeft - curLeft) + jitterX;
      let top  = (maxTop  - curTop)  + jitterY;

      left = clamp(left, EDGE_PADDING, maxLeft - EDGE_PADDING);
      top  = clamp(top,  EDGE_PADDING, maxTop  - EDGE_PADDING);

      if (isNearEdge(left, top, maxLeft, maxTop) || distanceToPoint(left, top, px, py) < MIN_SEPARATION){
        return randomSafeSpot(maxLeft, maxTop, px, py);
      }
      return { left, top };
    }

    function moveNoSmart(px, py, forceWrap = false){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const curLeft = b.left - z.left;
      const curTop  = b.top  - z.top;

      // If getting cornered OR forced wrap, wrap/teleport immediately.
      if (forceWrap || isNearEdge(curLeft, curTop, maxLeft, maxTop)){
        const spot = wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py);
        setNoPosition(spot.left, spot.top);
        growYes();
        return;
      }

      // Otherwise: run away directionally, but ONLY accept interior placements.
      const touch = isTouchLike();
      const baseDist = touch ? 320 : 240;
      const randDist = touch ? 260 : 180;

      for (let i = 0; i < MAX_TRIES; i++){
        const btnCx = b.left + b.width / 2;
        const btnCy = b.top  + b.height / 2;

        let dx = btnCx - px;
        let dy = btnCy - py;
        const mag = Math.hypot(dx, dy) || 1;
        dx /= mag; dy /= mag;

        const jitter = (Math.random() * 190 - 95) * (Math.PI / 180);
        const cos = Math.cos(jitter), sin = Math.sin(jitter);
        const jx = dx * cos - dy * sin;
        const jy = dx * sin + dy * cos;

        const dist = baseDist + Math.random() * randDist + i * 10;

        let newLeft = curLeft + jx * dist;
        let newTop  = curTop  + jy * dist;

        newLeft = clamp(newLeft, EDGE_PADDING, maxLeft - EDGE_PADDING);
        newTop  = clamp(newTop,  EDGE_PADDING, maxTop  - EDGE_PADDING);

        if (isNearEdge(newLeft, newTop, maxLeft, maxTop)) continue;
        if (distanceToPoint(newLeft, newTop, px, py) < MIN_SEPARATION) continue;

        setNoPosition(newLeft, newTop);
        growYes();
        return;
      }

      // Fallback: safe interior teleport
      const spot = randomSafeSpot(maxLeft, maxTop, px, py);
      setNoPosition(spot.left, spot.top);
      growYes();
    }

    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    // DESKTOP: run away based on cursor proximity (this is what you asked for)
    zone.addEventListener("pointermove", (e) => {
      if (!mqFine.matches) return; // only do cursor-chase on fine pointer devices
      const { x, y } = getPoint(e);
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width/2) - x, (b.top + b.height/2) - y);
      if (d < TRIGGER_RADIUS) moveNoSmart(x, y, false);
    }, { passive: true });

    // DESKTOP: prevent fast “snipes”
    noBtn.addEventListener("pointerenter", (e) => {
      if (!mqFine.matches) return;
      const { x, y } = getPoint(e);
      moveNoSmart(x, y, true); // force wrap
    }, { passive: true });

    // MOBILE: no cursor—react to finger touches/moves in the zone
    zone.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const { x, y } = getPoint(e);
      moveNoSmart(x, y, true); // immediate wrap on touch
    }, { passive: false });

    zone.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const { x, y } = getPoint(e);
      // keep fleeing as finger moves nearby
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width/2) - x, (b.top + b.height/2) - y);
      if (d < TRIGGER_RADIUS) moveNoSmart(x, y, false);
    }, { passive: false });

    // If someone tries to press the "No" button directly (mobile/desktop), wrap instantly
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const { x, y } = getPoint(e);
      moveNoSmart(x, y, true);
    }, { passive: false });

    noBtn.addEventListener("click", (e) => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    // iOS gesture safety (optional)
    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
