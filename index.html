<script>
  const zone = document.getElementById("zone");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn  = document.getElementById("noBtn");
  const result = document.getElementById("result");
  const hint   = document.getElementById("hint");

  /* ---------- CONFETTI ---------- */
  const confettiCanvas = document.getElementById("confettiCanvas");

  function resizeConfettiCanvas() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    confettiCanvas.width = Math.floor(window.innerWidth * dpr);
    confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    confettiCanvas.style.width = "100vw";
    confettiCanvas.style.height = "100vh";
  }

  resizeConfettiCanvas();
  window.addEventListener("resize", resizeConfettiCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

  const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

  function fullScreenConfetti() {
    const end = Date.now() + 1600;

    (function frame() {
      confettiInstance({
        particleCount: 12,
        spread: 90,
        startVelocity: 45,
        ticks: 180,
        origin: { x: Math.random(), y: Math.random() * 0.3 }
      });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();

    setTimeout(() => {
      confettiInstance({
        particleCount: 300,
        spread: 140,
        startVelocity: 60,
        ticks: 220,
        origin: { x: 0.5, y: 0.55 }
      });
    }, 300);
  }

  /* ---------- NO BUTTON: FAST + SMOOTH RANDOM TELEPORT, UNCORNERABLE ---------- */

  // Tuning knobs
  let TRIGGER_RADIUS = 260;      // how close you can get before it moves
  let MIN_SEPARATION = 240;      // how far away it must land from pointer
  let SAFE_PADDING = 64;         // no-go band near edges (prevents cornering)
  const EDGE_PADDING = 10;       // absolute clamp boundary
  const MAX_TRIES = 120;

  function updateTuning() {
    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    TRIGGER_RADIUS = isMobile ? 320 : 260;
    MIN_SEPARATION = isMobile ? 270 : 240;
    SAFE_PADDING   = isMobile ? 72  : 64;
  }
  updateTuning();
  window.addEventListener("resize", updateTuning);
  window.addEventListener("orientationchange", () => setTimeout(updateTuning, 200));

  // Make movement smooth (uses left/top animation)
  // (If you already have transition on #noBtn that's fine too.)
  noBtn.style.willChange = "left, top";
  noBtn.style.transition = "left 70ms ease-out, top 70ms ease-out";

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  function getMax() {
    const z = zone.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    return {
      maxLeft: z.width - b.width,
      maxTop:  z.height - b.height
    };
  }

  function isNearEdge(left, top, maxLeft, maxTop) {
    return (
      left < SAFE_PADDING ||
      top < SAFE_PADDING ||
      left > (maxLeft - SAFE_PADDING) ||
      top > (maxTop - SAFE_PADDING)
    );
  }

  function distToPointer(left, top, px, py) {
    const z = zone.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    const cx = z.left + left + b.width / 2;
    const cy = z.top  + top  + b.height / 2;
    return Math.hypot(cx - px, cy - py);
  }

  function setNo(left, top) {
    noBtn.style.left = `${left}px`;
    noBtn.style.top  = `${top}px`;
    noBtn.style.transform = "none";
  }

  // Pick a truly random safe interior point, far from pointer
  function randomSafeSpot(px, py) {
    const { maxLeft, maxTop } = getMax();

    const spanX = Math.max(1, maxLeft - 2 * SAFE_PADDING);
    const spanY = Math.max(1, maxTop  - 2 * SAFE_PADDING);

    for (let i = 0; i < MAX_TRIES; i++) {
      const left = SAFE_PADDING + Math.random() * spanX;
      const top  = SAFE_PADDING + Math.random() * spanY;

      if (distToPointer(left, top, px, py) >= MIN_SEPARATION) {
        return { left, top };
      }
    }

    // Fallback: center-ish
    return {
      left: clamp(maxLeft * 0.5, SAFE_PADDING, maxLeft - SAFE_PADDING),
      top:  clamp(maxTop  * 0.5, SAFE_PADDING, maxTop  - SAFE_PADDING)
    };
  }

  // Teleport in a way that never lets it get pinned in corners:
  // if current is near edge => force a deep interior jump first.
  function teleportNo(px, py, force = false) {
    const z = zone.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    const { maxLeft, maxTop } = getMax();

    const curLeft = b.left - z.left;
    const curTop  = b.top  - z.top;

    // If being cornered, make the safe band even stricter for the next hop
    // so it jumps deeper inside.
    const oldSafe = SAFE_PADDING;
    if (force || isNearEdge(curLeft, curTop, maxLeft, maxTop)) {
      SAFE_PADDING = Math.min(96, oldSafe + 10);
      const spot = randomSafeSpot(px, py);
      setNo(spot.left, spot.top);
      SAFE_PADDING = oldSafe;
      return;
    }

    const spot = randomSafeSpot(px, py);
    setNo(spot.left, spot.top);
  }

  /* ---------- POINTER TRACKING (FAST + CONTINUOUS) ---------- */
  let lastX = null, lastY = null;
  let chasing = false;

  function updateLast(e) {
    if (!e) return;
    if (e.touches && e.touches[0]) {
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else {
      lastX = e.clientX;
      lastY = e.clientY;
    }
  }

  // Each frame, if you’re close enough, it jumps.
  // Cooldown prevents jittery rapid-fire, but still feels uncatchable.
  let cooldownUntil = 0;
  const COOLDOWN_MS = 65;

  function tick() {
    if (chasing && lastX != null && lastY != null) {
      const now = performance.now();
      if (now >= cooldownUntil) {
        const b = noBtn.getBoundingClientRect();
        const d = Math.hypot(
          (b.left + b.width / 2) - lastX,
          (b.top  + b.height / 2) - lastY
        );
        if (d < TRIGGER_RADIUS) {
          teleportNo(lastX, lastY);
          cooldownUntil = now + COOLDOWN_MS;
        }
      }
    }

    // If for any reason it ends up near the edge, auto-uncorner it.
    const z = zone.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    const { maxLeft, maxTop } = getMax();
    const curLeft = b.left - z.left;
    const curTop  = b.top  - z.top;
    if (isNearEdge(curLeft, curTop, maxLeft, maxTop) && lastX != null && lastY != null) {
      teleportNo(lastX, lastY, true);
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Pointer events
  zone.addEventListener("pointermove", (e) => updateLast(e), { passive: true });
  zone.addEventListener("pointerdown", (e) => {
    updateLast(e);
    chasing = true;
    // Immediate jump on press so you can’t tap it
    teleportNo(lastX, lastY, true);
  }, { passive: false });

  zone.addEventListener("pointerup", () => { chasing = false; }, { passive: true });
  zone.addEventListener("pointercancel", () => { chasing = false; }, { passive: true });

  // Touch fallback (older Safari)
  zone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    updateLast(e);
    chasing = true;
    teleportNo(lastX, lastY, true);
  }, { passive: false });

  zone.addEventListener("touchmove", (e) => {
    e.preventDefault();
    updateLast(e);
  }, { passive: false });

  zone.addEventListener("touchend", () => { chasing = false; }, { passive: true });
  zone.addEventListener("touchcancel", () => { chasing = false; }, { passive: true });

  // Extra "uncatchable" defenses
  noBtn.addEventListener("pointerenter", (e) => {
    updateLast(e);
    teleportNo(e.clientX, e.clientY, true);
  });

  noBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    updateLast(e);
    teleportNo(e.clientX, e.clientY, true);
  }, { passive: false });

  noBtn.addEventListener("click", (e) => e.preventDefault());

  /* ---------- YES CLICK (NO GROWTH) ---------- */
  yesBtn.addEventListener("click", () => {
    zone.style.display = "none";
    hint.style.display = "none";
    result.style.display = "block";
    resizeConfettiCanvas();
    fullScreenConfetti();
  });

  document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
</script>
