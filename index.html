<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68;
    }
    *{ box-sizing:border-box; }

    html,body{ height:100%; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
    body{
      margin:0; min-height:100svh;
      display:grid; place-items:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif;
      overflow:hidden; padding:16px;
      touch-action:none;
    }

    #confettiCanvas{
      position:fixed; inset:0;
      width:100vw; height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
    }

    .art{
      width:min(260px,80vw);
      height:auto;
      margin:0 auto 10px;
      display:block;
      border-radius:18px;
      box-shadow:0 10px 14px rgba(0,0,0,.18);
    }

    h1{
      font-size:clamp(24px,5vw,44px);
      margin:12px 0 18px;
      line-height:1.1;
    }

    .button-zone{
      position:relative;
      width:min(620px,92%);
      height:260px;              /* more vertical room */
      margin:0 auto;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    button{
      position:absolute;
      padding:16px 24px;
      font-size:18px;
      font-weight:800;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }

    /* YES stays fixed and NEVER grows */
    #yesBtn{
      left:22%;
      top:50%;
      transform:translate(-50%,-50%);
      background:var(--yes);
      color:#fff;
      transition: background .12s ease;
    }
    #yesBtn:hover{ background:var(--yesHover); }

    /* NO is moved by JS via left/top px */
    #noBtn{
      background:#e5e7eb;
      color:#111827;
      transition:left .05s linear, top .05s linear;
      will-change:left, top;
    }

    .hint{ margin-top:10px; font-size:13px; opacity:.7; }

    .result{
      display:none;
      margin-top:18px;
      animation:pop .35s ease;
    }
    .result h2{
      font-size:clamp(30px,5vw,46px);
      margin:10px 0;
    }
    .fireworks{
      width:min(380px,90vw);
      margin:0 auto;
      display:block;
    }

    @keyframes pop{
      from{ transform:scale(.96); opacity:0; }
      to{ transform:scale(1); opacity:1; }
    }

    @media (max-width:480px){
      .card{ padding:22px 16px; border-radius:18px; }
      .button-zone{ height:320px; width:100%; }
      button{ font-size:20px; padding:18px 26px; }
      #yesBtn{ left:28%; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <img class="art" src="puss-in-boots-meme-3.jpg" alt="Puss in Boots begging eyes" />
    <h1>Maya, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img class="fireworks"
        src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
        alt="Fireworks" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint   = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width  = Math.floor(window.innerWidth  * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const confettiInstance = confetti.create(confettiCanvas, { resize:false, useWorker:true });

    function fullScreenConfetti(){
      const end = Date.now() + 1600;

      (function frame(){
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- NO BUTTON: ACTUALLY HARD TO CATCH ---------- */
    const mqFine = window.matchMedia("(pointer: fine)");
    const mqCoarse = window.matchMedia("(pointer: coarse)");
    const isTouchLike = () =>
      mqCoarse.matches || ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

    const clamp = (n,min,max) => Math.max(min, Math.min(max, n));

    // Bigger values = harder to catch
    let TRIGGER_RADIUS = 260;
    let MIN_SEPARATION = 240;
    let SAFE_PADDING = 70;  // keep away from edges so it can't be cornered
    const EDGE_PADDING = 10;
    const MAX_TRIES = 70;

    function retune(){
      const touch = isTouchLike();
      TRIGGER_RADIUS = touch ? 360 : 280;
      MIN_SEPARATION = touch ? 320 : 260;
      SAFE_PADDING   = touch ? 88  : 70;
    }
    retune();
    window.addEventListener("resize", retune);
    window.addEventListener("orientationchange", () => setTimeout(retune, 200));

    function setNo(left, top){
      noBtn.style.left = left + "px";
      noBtn.style.top  = top  + "px";
      noBtn.style.transform = "none";
    }

    function placeNoInitial(){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const left = clamp(z.width * 0.72 - b.width/2, EDGE_PADDING, z.width - b.width - EDGE_PADDING);
      const top  = clamp(z.height * 0.52 - b.height/2, EDGE_PADDING, z.height - b.height - EDGE_PADDING);
      setNo(left, top);
    }
    requestAnimationFrame(placeNoInitial);
    window.addEventListener("resize", () => requestAnimationFrame(placeNoInitial));

    function distanceToPoint(left, top, px, py){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const cx = z.left + left + b.width/2;
      const cy = z.top  + top  + b.height/2;
      return Math.hypot(cx - px, cy - py);
    }

    function isNearEdge(left, top, maxLeft, maxTop){
      return (
        left < SAFE_PADDING ||
        top < SAFE_PADDING ||
        left > (maxLeft - SAFE_PADDING) ||
        top > (maxTop - SAFE_PADDING)
      );
    }

    function randomSafeSpot(maxLeft, maxTop, px, py){
      const spanX = Math.max(1, maxLeft - 2 * SAFE_PADDING);
      const spanY = Math.max(1, maxTop  - 2 * SAFE_PADDING);

      for (let i = 0; i < 120; i++){
        const left = SAFE_PADDING + Math.random() * spanX;
        const top  = SAFE_PADDING + Math.random() * spanY;
        if (distanceToPoint(left, top, px, py) >= MIN_SEPARATION) return { left, top };
      }
      return { left: maxLeft * 0.5, top: maxTop * 0.5 };
    }

    // Wrap far away (breaks corner traps instantly)
    function wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py){
      const jitterX = (Math.random() * 2 - 1) * Math.min(180, maxLeft * 0.38);
      const jitterY = (Math.random() * 2 - 1) * Math.min(160, maxTop  * 0.55);

      let left = (maxLeft - curLeft) + jitterX;
      let top  = (maxTop  - curTop)  + jitterY;

      left = clamp(left, EDGE_PADDING, maxLeft - EDGE_PADDING);
      top  = clamp(top,  EDGE_PADDING, maxTop  - EDGE_PADDING);

      if (isNearEdge(left, top, maxLeft, maxTop) || distanceToPoint(left, top, px, py) < MIN_SEPARATION){
        return randomSafeSpot(maxLeft, maxTop, px, py);
      }
      return { left, top };
    }

    // Track pointer velocity so it dodges “where you’re going”, not where you are
    let lastPX = null, lastPY = null, lastT = null;
    function updateVelocity(px, py){
      const t = performance.now();
      let vx = 0, vy = 0;
      if (lastT != null){
        const dt = Math.max(1, t - lastT);
        vx = (px - lastPX) / dt;
        vy = (py - lastPY) / dt;
      }
      lastPX = px; lastPY = py; lastT = t;
      return { vx, vy };
    }

    // Temporary “ghost” to prevent last-millisecond clicks
    let ghosting = false;
    function ghostNo(ms=180){
      if (ghosting) return;
      ghosting = true;
      noBtn.style.pointerEvents = "none";
      setTimeout(() => {
        noBtn.style.pointerEvents = "auto";
        ghosting = false;
      }, ms);
    }

    function evade(px, py, forceWrap=false){
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const curLeft = parseFloat(noBtn.style.left) || (b.left - z.left);
      const curTop  = parseFloat(noBtn.style.top)  || (b.top  - z.top);

      // If forced or near edge -> wrap/teleport
      if (forceWrap || isNearEdge(curLeft, curTop, maxLeft, maxTop)){
        const spot = wrapOpposite(curLeft, curTop, maxLeft, maxTop, px, py);
        setNo(spot.left, spot.top);
        ghostNo();
        return;
      }

      const { vx, vy } = updateVelocity(px, py);

      // Predict where the pointer is heading (helps on fast cursor moves)
      const lead = mqFine.matches ? 90 : 120; // ms
      const predX = px + vx * lead;
      const predY = py + vy * lead;

      // Direction away from predicted pointer position
      const btnCx = b.left + b.width/2;
      const btnCy = b.top  + b.height/2;

      let dx = btnCx - predX;
      let dy = btnCy - predY;
      const mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      // Add a strong perpendicular component so it moves UP/DOWN too (not just side-to-side)
      const perpX = -dy;
      const perpY = dx;

      const touch = isTouchLike();
      const baseDist = touch ? 420 : 360;
      const randDist = touch ? 340 : 280;

      for (let i = 0; i < MAX_TRIES; i++){
        // pick a random blend of away + perpendicular
        const wPerp = 0.6 + Math.random() * 0.9;     // strong perpendicular
        const wAway  = 0.8 + Math.random() * 0.6;

        // random sign flips prevent "pattern" trapping
        const s1 = Math.random() < 0.5 ? -1 : 1;
        const s2 = Math.random() < 0.5 ? -1 : 1;

        let mx = (dx * wAway * s1) + (perpX * wPerp * s2);
        let my = (dy * wAway * s1) + (perpY * wPerp * s2);
        const mm = Math.hypot(mx, my) || 1;
        mx /= mm; my /= mm;

        const dist = baseDist + Math.random() * randDist + i * 8;

        let left = curLeft + mx * dist;
        let top  = curTop  + my * dist;

        left = clamp(left, EDGE_PADDING, maxLeft - EDGE_PADDING);
        top  = clamp(top,  EDGE_PADDING, maxTop  - EDGE_PADDING);

        if (isNearEdge(left, top, maxLeft, maxTop)) continue;
        if (distanceToPoint(left, top, px, py) < MIN_SEPARATION) continue;

        setNo(left, top);
        ghostNo();
        return;
      }

      // fallback
      const spot = randomSafeSpot(maxLeft, maxTop, px, py);
      setNo(spot.left, spot.top);
      ghostNo();
    }

    function getPoint(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    // DESKTOP: run away based on cursor proximity
    zone.addEventListener("pointermove", (e) => {
      if (!mqFine.matches) return;
      const { x, y } = getPoint(e);
      const bb = noBtn.getBoundingClientRect();
      const d = Math.hypot((bb.left + bb.width/2) - x, (bb.top + bb.height/2) - y);
      if (d < TRIGGER_RADIUS) evade(x, y, false);
    }, { passive:true });

    // DESKTOP: if you get close enough to enter it, it instantly wraps away
    noBtn.addEventListener("pointerenter", (e) => {
      if (!mqFine.matches) return;
      const { x, y } = getPoint(e);
      evade(x, y, true);
    }, { passive:true });

    // MOBILE: react to finger touches/moves (no cursor)
    zone.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const { x, y } = getPoint(e);
      evade(x, y, true);
    }, { passive:false });

    zone.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const { x, y } = getPoint(e);
      const bb = noBtn.getBoundingClientRect();
      const d = Math.hypot((bb.left + bb.width/2) - x, (bb.top + bb.height/2) - y);
      if (d < TRIGGER_RADIUS) evade(x, y, false);
    }, { passive:false });

    // If anyone tries pressing NO directly, it wraps instantly
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const { x, y } = getPoint(e);
      evade(x, y, true);
    }, { passive:false });

    noBtn.addEventListener("click", (e) => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive:false });
  </script>
</body>
</html>
