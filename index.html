<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya, will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc; --yes:#ff3b7a; --yesHover:#ff1f68;
    }
    *{box-sizing:border-box}
    html,body{height:100%; overscroll-behavior:none}
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif; overflow:hidden; padding:16px;
      -webkit-text-size-adjust:100%; touch-action:none;
    }

    #confettiCanvas{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;}

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .art{
      width:min(260px,80vw);
      margin:0 auto 0;
      display:block;
      border-radius:16px;
      filter:drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1{
      font-size:clamp(24px,5vw,44px);
      margin:8px 0 0;
      line-height:1.1;
    }

    /* This is the "white space" where No can roam */
    #playArea{
      position:relative;
      width:min(560px, 96%);
      margin:0 auto;
      height:240px;
      border-radius:18px;
      background:transparent;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    button{
      position:absolute;
      padding:16px 24px;
      font-size:18px;
      font-weight:800;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      -webkit-tap-highlight-color:transparent;
      white-space:nowrap;
    }

    #yesBtn{
      left:28%;
      top:50%;
      transform:translate(-50%, -50%);
      background:var(--yes);
      color:#fff;
    }
    #yesBtn:hover{background:var(--yesHover);}

    /* NO uses GPU transform; we animate via JS by updating --nx/--ny */
    #noBtn{
      left:0; top:0;
      transform: translate3d(var(--nx, 0px), var(--ny, 0px), 0) translate(-50%, -50%);
      background:#e5e7eb;
      color:#111827;

      /* mouse can never actually hover/click it */
      pointer-events:none;

      /* transitions get enabled after first placement */
      transition: none;
      will-change: transform;
    }

    .hint{margin-top:2px; font-size:13px; opacity:.7;}

    .result{
      display:none;
      margin-top:8px;
      animation:pop .35s ease;
    }
    .result h2{font-size:clamp(30px,5vw,46px); margin:10px 0;}
    .fireworks{width:min(380px,90vw); margin:0 auto; display:block; border-radius:14px;}

    @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

    @media (max-width:480px){
      .card{padding:22px 16px; border-radius:18px;}
      #playArea{height:300px; width:100%;}
      #yesBtn{left:26%;}
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <img class="art" src="puss-in-boots-meme-3.jpg" alt="Puss in Boots" />
    <h1>Maya, will you be my valentine?</h1>

    <section id="playArea">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </section>

    <div class="hint" id="hint">I won't take no for an answer :)</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img class="fireworks" src="giphy.gif" alt="Tiger Woods celebration" />
    </section>
  </main>

  <script>
    const playArea = document.getElementById("playArea");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint   = document.getElementById("hint");
    const confettiCanvas = document.getElementById("confettiCanvas");

    /* ---------- Confetti (safe) ---------- */
    function resizeConfettiCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const canConfetti = typeof window.confetti === "function";
    const confettiInstance = canConfetti ? window.confetti.create(confettiCanvas, { resize:false, useWorker:true }) : null;

    function fullScreenConfetti(){
      if(!confettiInstance) return;
      const end = Date.now() + 1400;
      (function frame(){
        confettiInstance({
          particleCount: 14,
          spread: 100,
          startVelocity: 52,
          ticks: 190,
          origin: { x: Math.random(), y: Math.random() * 0.35 }
        });
        if(Date.now() < end) requestAnimationFrame(frame);
      })();
      setTimeout(() => confettiInstance({
        particleCount: 260,
        spread: 140,
        startVelocity: 62,
        ticks: 220,
        origin: { x: 0.5, y: 0.55 }
      }), 250);
    }

    /* ---------- NO movement: smooth dash to random safe target ---------- */

    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

    function areaRect(){
      return playArea.getBoundingClientRect();
    }

    // Current NO center in page coords
    function noRect(){
      // This returns a real rect even though pointer-events is none
      return noBtn.getBoundingClientRect();
    }

    function tuning(){
      const a = areaRect();
      const b = noRect();

      const w = Math.max(1, a.width);
      const h = Math.max(1, a.height);

      // Safe padding as fraction of area (prevents pinning/cornering)
      const padX = clamp(w * 0.10, 10, 52);
      const padY = clamp(h * 0.10, 10, 52);

      // Landing distance from pointer (bigger = more impossible)
      const minSep = clamp(Math.min(w, h) * 0.62, 160, 420);

      // How early it runs away (rect-inflation trigger)
      const preempt = clamp(Math.min(w, h) * 0.22, 60, 140);

      // Dash duration (ms): smooth but fast
      const dashMs = 120;

      return { a, b, padX, padY, minSep, preempt, dashMs };
    }

    // Set position in playArea-local coords (center coords)
    function setNoLocal(cx, cy){
      noBtn.style.setProperty("--nx", cx + "px");
      noBtn.style.setProperty("--ny", cy + "px");
    }

    // Pick random safe center location inside playArea
    function pickSafeTarget(px, py, forceDeep=false){
      const { a, b, padX, padY, minSep } = tuning();

      // center bounds in local coords (because we place by center)
      const minCX = padX + b.width/2;
      const maxCX = a.width - padX - b.width/2;
      const minCY = padY + b.height/2;
      const maxCY = a.height - padY - b.height/2;

      const spanX = Math.max(1, maxCX - minCX);
      const spanY = Math.max(1, maxCY - minCY);

      // if space is too small, just center
      if (spanX < 2 || spanY < 2) return { cx: a.width/2, cy: a.height/2 };

      const deepBoost = forceDeep ? 26 : 0;
      const minCX2 = clamp(minCX + deepBoost, minCX, maxCX);
      const maxCX2 = clamp(maxCX - deepBoost, minCX2, maxCX);
      const minCY2 = clamp(minCY + deepBoost, minCY, maxCY);
      const maxCY2 = clamp(maxCY - deepBoost, minCY2, maxCY);

      const spanX2 = Math.max(1, maxCX2 - minCX2);
      const spanY2 = Math.max(1, maxCY2 - minCY2);

      for (let i=0; i<260; i++){
        const cx = minCX2 + Math.random() * spanX2;
        const cy = minCY2 + Math.random() * spanY2;

        const worldX = a.left + cx;
        const worldY = a.top  + cy;

        if (Math.hypot(worldX - px, worldY - py) >= minSep) return { cx, cy };
      }

      return { cx: (minCX2+maxCX2)/2, cy: (minCY2+maxCY2)/2 };
    }

    // Smooth “dash” to new target (no teleport pop)
    let animating = false;
    let lastMoveAt = 0;

    function dashToTarget(px, py, forceDeep=false){
      const { dashMs } = tuning();

      // throttle so it doesn't freak out multiple times per single move event
      const now = performance.now();
      if (animating && now - lastMoveAt < 25) return;

      const a = areaRect();
      // current local center from CSS vars if present, else from rect
      const cur = noRect();
      const curLocalX = (cur.left + cur.width/2) - a.left;
      const curLocalY = (cur.top  + cur.height/2) - a.top;

      const tgt = pickSafeTarget(px, py, forceDeep);

      animating = true;
      lastMoveAt = now;

      // enable transition just for the dash
      noBtn.style.transition = `transform ${dashMs}ms cubic-bezier(.15,.9,.2,1)`;
      setNoLocal(tgt.cx, tgt.cy);

      // after dash, keep transition fast for subsequent moves
      window.setTimeout(() => {
        animating = false;
        noBtn.style.transition = "transform 90ms cubic-bezier(.15,.9,.2,1)";
      }, dashMs + 10);
    }

    // Trigger based on inflated rect distance (prevents ever getting on it)
    function shouldEvade(px, py){
      const { b, preempt } = tuning();

      // Inflate rect by preempt pixels
      const left   = b.left   - preempt;
      const right  = b.right  + preempt;
      const top    = b.top    - preempt;
      const bottom = b.bottom + preempt;

      // if pointer is inside inflated rectangle => evade immediately
      return (px >= left && px <= right && py >= top && py <= bottom);
    }

    // Also evade if near edges (uncornerable)
    function edgeCornered(){
      const { a, b, padX, padY } = tuning();
      const cx = (b.left + b.width/2) - a.left;
      const cy = (b.top  + b.height/2) - a.top;
      return (
        cx < padX || cy < padY ||
        cx > (a.width - padX) || cy > (a.height - padY)
      );
    }

    /* ---------- INITIAL PLACEMENT (fix out-of-place on load) ---------- */
    function initialPlace(){
      // Turn transitions OFF for first placement so it doesn't “fly in”
      noBtn.style.transition = "none";

      // Need layout to be stable (image loaded etc.)
      const a = areaRect();
      const px = a.left + a.width/2;
      const py = a.top  + a.height/2;

      const tgt = pickSafeTarget(px, py, true);
      setNoLocal(tgt.cx, tgt.cy);

      // Next frame: enable transitions
      requestAnimationFrame(() => {
        noBtn.style.transition = "transform 90ms cubic-bezier(.15,.9,.2,1)";
      });
    }

    // Run after everything is laid out
    window.addEventListener("load", initialPlace);

    /* ---------- MAKE IT IMPOSSIBLE TO HOVER ---------- */
    let armed = true;

    function onPointerMove(px, py){
      if (!armed) return;

      // Evade BEFORE pointer reaches it
      if (shouldEvade(px, py)) {
        dashToTarget(px, py, true);
        return;
      }

      // If it gets cornered, force a deep interior dash
      if (edgeCornered()) {
        dashToTarget(px, py, true);
      }
    }

    // Track globally, not just in the area (so it flees pre-hover)
    window.addEventListener("pointermove", (e) => onPointerMove(e.clientX, e.clientY), { passive:true });
    window.addEventListener("pointerdown", (e) => { if(armed) dashToTarget(e.clientX, e.clientY, true); }, { passive:true });

    // Touch fallback
    window.addEventListener("touchstart", (e) => {
      if (!armed) return;
      const t = e.touches && e.touches[0];
      if (t) dashToTarget(t.clientX, t.clientY, true);
    }, { passive:true });

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      armed = false;
      playArea.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive:false });
  </script>
</body>
</html>
